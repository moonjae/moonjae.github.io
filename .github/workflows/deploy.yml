
# Build the site and publish it to the gh-pages branch, which GitHub Pages serves.
#
# jekyll-assets is not a plugin GitHub Pages can run itself, so every change on
# master (including edits made through Pages CMS) is built here. The job runs in
# the jekyll/jekyll:3.8 image so it uses the same Ruby and gems as a local
# Docker build.

name: Deploy site

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    container:
      image: jekyll/jekyll:3.8
    env:
      JEKYLL_ENV: production
      BUNDLE_PATH: vendor/bundle
    steps:
      - name: Install git
        run: apk add --no-cache git

      - name: Check out
        uses: actions/checkout@v4

      - name: Cache gems
        uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: gems-${{ hashFiles('Gemfile.lock') }}

      - name: Install gems
        run: bundle install --jobs 4

      - name: Install JavaScript dependencies
        run: yarn install --modules-folder ./_assets/yarn --non-interactive

      - name: Build
        run: bundle exec jekyll build --trace

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Deploy ${{ github.sha }}"
