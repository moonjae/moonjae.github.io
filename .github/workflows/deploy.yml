
# Build the site and publish it to the gh-pages branch, which GitHub Pages serves.
#
# jekyll-assets is not a plugin GitHub Pages can run itself, so every change on
# master (including edits made through Pages CMS) is built here. The build runs
# in the jekyll/jekyll:3.8 image via docker run, so it uses the same Ruby and
# gems as a local Docker build. The image is too old to host GitHub's JavaScript
# actions directly, which is why it is not used as the job container.

name: Deploy site

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Cache gems
        uses: actions/cache@v4
        with:
          path: .bundle-cache
          key: gems-${{ hashFiles('Gemfile.lock') }}

      - name: Build in the Jekyll 3.8 image
        run: |
          mkdir -p .bundle-cache _assets/yarn _site
          docker run --rm \
            -v "$PWD:/srv/jekyll" \
            -v "$PWD/.bundle-cache:/srv/bundle" \
            -e JEKYLL_UID="$(id -u)" -e JEKYLL_GID="$(id -g)" \
            -e BUNDLE_PATH=/srv/bundle \
            -e JEKYLL_ENV=production \
            jekyll/jekyll:3.8 \
            sh -c 'bundle install --jobs 4 \
              && yarn install --modules-folder ./_assets/yarn --non-interactive \
              && bundle exec jekyll build --trace'

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Deploy ${{ github.sha }}"
