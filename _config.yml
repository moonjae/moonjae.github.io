# Site

name: Jae Moon
tagline: Tech, Yu-Gi-Oh, and other thoughts
description: "Notes from studying algorithms and system design, thoughts on Yu-Gi-Oh, and whatever else is on my mind."
intro: "[Two sentences in your own voice. Who you are, what you do, and what this blog is for: notes from studying algorithms and system design, thoughts on Yu-Gi-Oh, and whatever else is on your mind.]"
url: https://moonjae.github.io

# Hero plate on the home page (image lives in _assets/images)

hero:
  image: hero-plate.jpg
  alt: "Pharaoh bust in an engraved style, one side rendered as flowing wood grain"
  caption: "Pharaoh bust — created by Jae Moon"


# Optional settings

about_enabled: true # Show the About link in the header and footer
rss_enabled: true # Show the RSS link in the header and footer
discus_identifier: # Add your Disqus identifier
ga_analytics: # Add your GA Tracking Id
social:
  email: # Add your Email address
  github: moonjae # Add your GitHub handle
  linkedin: jae-moon # Add your LinkedIn handle
  twitter: # Add your Twitter handle
  instagram: # Add your Instagram handle
  youtube: # Add your Youtube handle


# Important settings (change at own risk)

assets:
  plugins:
    css: { autoprefixer: {}}
    img: { optim: {}}
  source_maps: false
  sources:
    - _assets/javascripts
    - _assets/stylesheets
    - _assets/yarn
collections:
  my_tags:
    output: true
    permalink: /tag/:slug/
defaults:
  -
    scope:
      path: ""
      type: my_tags
    values:
      layout: articles_by_tag
exclude:
  - .travis.yml
  - bin/*
  - circle.yml
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - README.md
  - vendor/
  - yarn.lock
plugins:
  - jekyll-assets
  - jekyll-sitemap
  - jemoji
permalink: posts/:slug
